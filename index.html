<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fechador DayDots</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍩%3C/text%3E%3C/svg%3E">
  <script>
    // Aplica el tema antes de pintar la página para evitar parpadeos
    (function () {
      var tema = null;
      try { tema = localStorage.getItem("daydotsTema"); } catch (e) {}
      if (tema !== "light" && tema !== "dark") {
        tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", tema);
    })();
  </script>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7385;
      --accent: #2f6fed;
      --accent-dark: #2459c4;
      --error: #d33a3a;
      --border: #dfe3ea;
      --result-bg: #eef3ff;
    }
    :root { color-scheme: light; }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #12151c;
      --card: #1c212c;
      --text: #eef0f5;
      --muted: #8f98ab;
      --accent: #5b92ff;
      --accent-dark: #7ba8ff;
      --error: #ff6b6b;
      --border: #2c3342;
      --result-bg: #1f2a44;
    }
    * { box-sizing: border-box; }
    .card { position: relative; }
    h1 { padding-right: 48px; }
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      padding: 0;
      font-size: 1.2rem;
      line-height: 1;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .theme-toggle:hover { background: var(--result-bg); }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .subtitle { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
    .today {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg);
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
    select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
    }
    select:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .row { display: flex; gap: 8px; }
    input[type="number"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 1.1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
    }
    input[type="number"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .quick button {
      padding: 6px 12px;
      font-size: 0.85rem;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .quick button:hover { background: var(--result-bg); }
    .error { color: var(--error); margin-top: 14px; font-size: 0.9rem; min-height: 1.2em; }
    .result {
      margin-top: 8px;
      padding: 18px;
      border-radius: 12px;
      background: var(--result-bg);
      display: none;
    }
    .result .small { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
    .result .big { font-size: 1.35rem; font-weight: 700; }
    .history { margin-top: 24px; display: none; }
    .history h2 { font-size: 0.9rem; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
    .history ul { list-style: none; margin: 0; padding: 0; }
    .history li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .history li span:first-child { color: var(--muted); white-space: nowrap; }
    footer { margin-top: 20px; text-align: center; font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <button class="theme-toggle" id="tema" type="button" aria-label="Cambiar entre modo claro y oscuro"></button>
    <h1>Fechador DayDots</h1>
    <p class="subtitle">Calcula la fecha del DayDot con facilidad y exactitud.</p>

    <div class="today" id="hoy"></div>

    <label for="hora">Hora de fechado</label>
    <select id="hora">
      <optgroup label="Más frecuentes">
        <option value="10 pm">10 pm</option>
        <option value="11 pm">11 pm</option>
      </optgroup>
      <optgroup label="Todas las horas" id="todasHoras"></optgroup>
    </select>

    <label for="dias">Tiempo de vida del producto (en días)</label>
    <div class="row">
      <input type="number" id="dias" min="1" step="1" inputmode="numeric" placeholder="Ej: 7" autofocus>
      <button id="calcular" type="button">Calcular</button>
    </div>

    <div class="quick" id="quick"></div>
    <div class="error" id="error" role="alert"></div>

    <div class="result" id="resultado">
      <div class="small" id="vida"></div>
      <div class="big" id="daydot"></div>
    </div>

    <div class="history" id="historial">
      <h2>Últimos cálculos</h2>
      <ul id="lista"></ul>
    </div>

    <footer>by Pier014</footer>
  </main>

  <script>
    const NOMBRES_DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
    const ATAJOS = [1, 3, 4, 5, 7, 10, 15, 30, 90, 180];

    const $ = (id) => document.getElementById(id);
    const inputDias = $("dias");
    const errorEl = $("error");
    const resultado = $("resultado");
    const historial = $("historial");
    const lista = $("lista");
    const selectHora = $("hora");

    // Llena la lista con las 24 horas (12 am a 11 pm)
    for (let h = 0; h < 24; h++) {
      const h12 = h % 12 === 0 ? 12 : h % 12;
      const sufijo = h < 12 ? "am" : "pm";
      const valor = `${h12} ${sufijo}`;
      const extra = h === 0 ? " (medianoche)" : h === 12 ? " (mediodía)" : "";
      const op = document.createElement("option");
      op.value = valor;
      op.textContent = valor + extra;
      $("todasHoras").appendChild(op);
    }

    // Recuerda la última hora elegida en este navegador
    try {
      const guardada = localStorage.getItem("daydotsHora");
      if (guardada) selectHora.value = guardada;
    } catch (e) {}
    selectHora.addEventListener("change", () => {
      try { localStorage.setItem("daydotsHora", selectHora.value); } catch (e) {}
      if (inputDias.value) calcular(inputDias.value);
    });

    const pad = (n) => String(n).padStart(2, "0");

    function formatear(fecha) {
      return `${pad(fecha.getDate())}/${pad(fecha.getMonth() + 1)}/${fecha.getFullYear()}`;
    }

    function actualizarHoy() {
      const hoy = new Date();
      $("hoy").textContent = `Hoy: ${NOMBRES_DIAS[hoy.getDay()]} ${formatear(hoy)}`;
    }

    function calcular(valor) {
      errorEl.textContent = "";
      const texto = String(valor).trim();

      if (!/^-?\d+$/.test(texto)) {
        resultado.style.display = "none";
        errorEl.textContent = "Ingrese un número entero válido.";
        return;
      }

      const TDV = parseInt(texto, 10);
      if (TDV <= 0) {
        resultado.style.display = "none";
        errorEl.textContent = "El tiempo de vida debe ser mayor que 0.";
        return;
      }

      // Se suma el tiempo de vida y se resta 1 para contar el día actual
      const fechado = new Date();
      fechado.setHours(12, 0, 0, 0); // evita problemas por cambios de horario
      fechado.setDate(fechado.getDate() + TDV - 1);

      const diaSemana = NOMBRES_DIAS[fechado.getDay()];
      const formateado = formatear(fechado);
      const textoFinal = `${diaSemana} ${formateado} ${selectHora.value}`;

      $("vida").textContent = `Tiempo de vida: ${TDV} ${TDV === 1 ? "día" : "días"}`;
      $("daydot").textContent = `DayDot: ${textoFinal}`;
      resultado.style.display = "block";

      agregarHistorial(TDV, textoFinal);
    }

    function agregarHistorial(TDV, texto) {
      const li = document.createElement("li");
      const a = document.createElement("span");
      const b = document.createElement("span");
      a.textContent = `${TDV} ${TDV === 1 ? "día" : "días"}`;
      b.textContent = texto;
      li.append(a, b);
      lista.prepend(li);
      while (lista.children.length > 5) lista.lastChild.remove();
      historial.style.display = "block";
    }

    // Botones de atajo
    ATAJOS.forEach((n) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = `${n} ${n === 1 ? "día" : "días"}`;
      b.addEventListener("click", () => {
        inputDias.value = n;
        calcular(n);
      });
      $("quick").appendChild(b);
    });

    $("calcular").addEventListener("click", () => calcular(inputDias.value));
    inputDias.addEventListener("keydown", (e) => {
      if (e.key === "Enter") calcular(inputDias.value);
    });

    // Botón de modo claro / oscuro
    const botonTema = $("tema");
    function pintarBotonTema() {
      const oscuro = document.documentElement.getAttribute("data-theme") === "dark";
      botonTema.textContent = oscuro ? "☀️" : "🌙";
      botonTema.title = oscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro";
    }
    botonTema.addEventListener("click", () => {
      const nuevo = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nuevo);
      try { localStorage.setItem("daydotsTema", nuevo); } catch (e) {}
      pintarBotonTema();
    });
    pintarBotonTema();

    actualizarHoy();
  </script>
</body>
</html>
